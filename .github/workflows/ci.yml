# Automatic checks on every pull request (and on main after merging).
# All four steps must pass before a pull request is merged.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL database for the database tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: innit
          POSTGRES_PASSWORD: innit
          POSTGRES_DB: innit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U innit" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://innit:innit@localhost:5432/innit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (code style)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
